# Release pipeline on main, modelled on magma-design-system/magma.
# semantic-release detects the next version from the conventional commits,
# bumps package.json + package-lock.json, pushes ONE chore(release) commit,
# tags it and creates the GitHub release. That release triggers main.yml,
# which runs the tests again and publishes to npm (trusted publishing / OIDC),
# exactly like a release created by hand from the GitHub UI.
#
# Nothing release-related lives in the repo: the toolchain is installed with
# `npm install --no-save` and the semantic-release config is written to a temp
# file at runtime, so the release commit only carries the version bump.
#
# semantic-release runs with RELEASE_PUSH_TOKEN, a fine-grained PAT (Contents:
# read and write on this repo) of a user in the bypass list of the `main`
# ruleset. Two reasons the default GITHUB_TOKEN cannot do it:
#   - the ruleset requires the status checks on every push to main, a commit
#     pushed directly can never carry them, and github-actions[bot] cannot be
#     added to the bypass list;
#   - events produced by GITHUB_TOKEN never trigger other workflows, so the
#     release would not start main.yml.
name: release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    # chore(release) pushes come from the release job itself: their version is
    # already tagged, so re-running would only be a wasted no-op
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/test.yml

  release:
    name: Release
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    needs: verify
    # no extra permissions: semantic-release only uses RELEASE_PUSH_TOKEN, the
    # workflow token just checks out the repo
    env:
      SEMANTIC_RELEASE_VERSION: 25.0.9
      SR_GIT_VERSION: 11.0.1
      # v10 of the preset needs a newer changelog writer than release-notes-generator 14 bundles
      CONVENTIONAL_CHANGELOG_VERSION: 9.3.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # otherwise the checkout's GITHUB_TOKEN overrides RELEASE_PUSH_TOKEN on git push
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm clean-install
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures
      - name: Install semantic-release (local, no-save)
        run: |
          npm install --no-save \
            semantic-release@${SEMANTIC_RELEASE_VERSION} \
            @semantic-release/git@${SR_GIT_VERSION} \
            conventional-changelog-conventionalcommits@${CONVENTIONAL_CHANGELOG_VERSION}
      - name: Write semantic-release config
        run: |
          cat > "${RUNNER_TEMP}/semantic-release.config.cjs" <<'EOF'
          module.exports = {
            branches: ['main'],
            plugins: [
              ['@semantic-release/commit-analyzer', { preset: 'conventionalcommits' }],
              ['@semantic-release/release-notes-generator', { preset: 'conventionalcommits' }],
              // only bumps package.json and package-lock.json: npm publish is done by main.yml
              ['@semantic-release/npm', { npmPublish: false }],
              [
                '@semantic-release/git',
                {
                  assets: ['package.json', 'package-lock.json'],
                  // the push of this commit is skipped by the chore(release) guard on the jobs above
                  message: 'chore(release): ${nextRelease.version}',
                },
              ],
              // release only: no comments on issues/PRs, no issue on failure,
              // so the token needs nothing beyond Contents
              ['@semantic-release/github', { successComment: false, failComment: false, failTitle: false }],
            ],
          };
          EOF
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: npx --no-install semantic-release -e "${RUNNER_TEMP}/semantic-release.config.cjs"
